services:
  localstack:
    image: localstack/localstack:3.8
    container_name: pc3-localstack
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      SERVICES: s3,sqs,dynamodb,sts
      AWS_DEFAULT_REGION: us-east-1
      DEBUG: "0"
      PERSISTENCE: "1"
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build: .
    container_name: pc3-tienda
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      PRODUCTS_TABLE: pc3-products
      ORDERS_TABLE: pc3-orders
      USER_IMAGES_BUCKET: pc3-user-images
      ORDERS_QUEUE: pc3-orders-queue
      ADMIN_USER: admin
      ADMIN_PASSWORD: Admin123!
      COOKIE_SECRET: pc3-local-demo-secret
    depends_on:
      localstack:
        condition: service_healthy

volumes:
  localstack-data:
